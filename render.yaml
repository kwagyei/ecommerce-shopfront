# Render blueprint. The database lives on Neon, so DATABASE_URL is set by hand
# in the Render dashboard (sync: false keeps it out of this file and out of git).
services:
  - type: web
    name: shopfront
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      # Stripe TEST key (sk_test_...). Set in the dashboard; empty disables checkout.
      - key: STRIPE_SECRET_KEY
        sync: false
      # whsec_... from the dashboard webhook endpoint for /stripe/webhook/. Without it the
      # endpoint refuses every delivery and Stripe keeps retrying until it's set.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
